<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扫码手机号登录 · 联调测试</title>
  <style>
    body { margin: 0; background: #f5f5f5; color: rgba(0,0,0,.88);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
    .card { max-width: 520px; margin: 48px auto; background: #fff; border-radius: 8px; padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 6px -1px rgba(0,0,0,.04); }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: rgba(0,0,0,.45); margin: 0 0 24px; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .row label { width: 72px; color: rgba(0,0,0,.65); flex: none; }
    select, input { flex: 1; height: 32px; padding: 0 11px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
    button { height: 32px; padding: 0 15px; border: 0; border-radius: 6px; background: #1677ff; color: #fff; font-size: 14px; cursor: pointer; }
    button:disabled { background: #d9d9d9; cursor: not-allowed; }
    .qr { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 24px; min-height: 40px; }
    .qr img { width: 220px; height: 220px; }
    .status { font-size: 16px; font-weight: 500; }
    .ok { color: #52c41a; } .warn { color: #faad14; } .err { color: #ff4d4f; }
    dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 16px 0 0; width: 100%; }
    dt { color: rgba(0,0,0,.45); } dd { margin: 0; word-break: break-all; }
    code { font-family: ui-monospace, Consolas, monospace; background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>扫码手机号登录 · 联调测试</h1>
    <p class="sub">这个页面模拟 PC / 网页客户端：出码、等待小程序回传手机号。</p>
    <div class="row">
      <label for="env">小程序版本</label>
      <select id="env">
        <option value="develop">开发版（develop）</option>
        <option value="trial">体验版（trial）</option>
        <option value="release">正式版（release）</option>
      </select>
    </div>
    <div class="row">
      <label for="page">页面路径</label>
      <input id="page" value="pages/qrlogin/index" />
    </div>
    <div class="row">
      <label></label>
      <button id="btn">生成二维码</button>
    </div>
    <div class="qr" id="qr"></div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    let timer = null, state = null;

    const TEXT = {
      waiting: ['等待扫码', ''],
      scanned: ['已扫码，等待在手机上点按钮', 'warn'],
      done: ['已拿到手机号', 'ok'],
      expired: ['二维码已过期，请重新生成', 'err'],
    };

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function render(img, v, error) {
      const [text, cls] = error ? [error, 'err'] : (TEXT[v.status] || [v.status, '']);
      let html = img ? '<img id="qrimg" alt="小程序码">' : '';
      html += '<div class="status ' + cls + '">' + esc(text) + '</div>';
      if (v) {
        html += '<dl>';
        html += '<dt>会话号</dt><dd><code>' + esc(v.state) + '</code></dd>';
        if (v.status !== 'done' && v.status !== 'expired') html += '<dt>剩余时间</dt><dd>' + v.expiresInSeconds + ' 秒</dd>';
        if (v.scanSeconds) html += '<dt>扫码用时</dt><dd>' + v.scanSeconds.toFixed(1) + ' 秒</dd>';
        if (v.doneSeconds) html += '<dt>完成用时</dt><dd>' + v.doneSeconds.toFixed(1) + ' 秒</dd>';
        if (v.phoneMasked) html += '<dt>手机号</dt><dd>+' + esc(v.countryCode) + ' ' + esc(v.phoneMasked) + '</dd>';
        if (v.openIdTail) html += '<dt>openid 尾号</dt><dd>' + esc(v.openIdTail) + '</dd>';
        if (v.lastError) html += '<dt>最近一次错误</dt><dd class="err">' + esc(v.lastError) + '</dd>';
        html += '</dl>';
      }
      $('qr').innerHTML = html;
      if (img) $('qrimg').src = img;
    }

    let qrImg = null;
    async function poll() {
      try {
        const res = await (await fetch('/api/qrlogin/status?state=' + state, { cache: 'no-store' })).json();
        if (res.code !== 0) throw new Error(res.errorMsg);
        const v = res.data;
        const finished = v.status === 'done' || v.status === 'expired';
        render(finished ? null : qrImg, v);
        if (finished) { clearInterval(timer); timer = null; }
      } catch (e) {
        render(qrImg, null, '查询状态失败：' + e.message);
      }
    }

    $('btn').onclick = async () => {
      if (timer) { clearInterval(timer); timer = null; }
      $('btn').disabled = true;
      $('qr').innerHTML = '<div class="status">正在生成…</div>';
      try {
        const resp = await fetch('/api/qrlogin/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ envVersion: $('env').value, page: $('page').value.trim() }),
        });
        const res = await resp.json();
        if (res.code !== 0) throw new Error(res.errorMsg);
        state = res.data.state;
        qrImg = res.data.qrcode;
        await poll();
        timer = setInterval(poll, 1500);
      } catch (e) {
        render(null, null, e.message);
      } finally {
        $('btn').disabled = false;
      }
    };
  </script>
</body>
</html>
